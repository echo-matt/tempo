name: Build Debug APK

# Compiles the app on a runner that has the Android SDK and can reach Google's
# Maven repository, so branch work gets a real build before it is merged.
on:
  push:
    branches:
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleTempoDebug --stacktrace

      - name: Report APK identity
        run: |
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n 1)
          APK=$(ls app/build/outputs/apk/tempo/debug/*.apk | head -n 1)
          echo "APK: $APK"
          "$AAPT" dump packagename "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tempo-debug-${{ github.sha }}
          path: app/build/outputs/apk/tempo/debug/*.apk
          if-no-files-found: error
          retention-days: 30
