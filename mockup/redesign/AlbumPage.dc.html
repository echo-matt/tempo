<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#0C0C0F;--tx:#F2F2F3;--tx-dim:#9A9AA2;--accent:#f24b6a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--tx);
      font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:#ff6b84;}
    .art{border-radius:8px;position:relative;overflow:hidden;flex:none;}
    .art::after{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.15),transparent 46%);}
    .a1{background-image:linear-gradient(142deg,#3b2f6e,#7b3f6b 55%,#c05a58);}
    .trk{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;}
    .tno{width:20px;text-align:center;font-size:13px;color:#6E6E77;flex:none;font-variant-numeric:tabular-nums;}
    .ttl{font-size:15px;font-weight:500;letter-spacing:-.01em;line-height:1.3;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .sub{font-size:12.5px;color:var(--tx-dim);line-height:1.3;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .dur{font-size:12px;color:#6E6E77;font-variant-numeric:tabular-nums;flex:none;}
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#0C0C0F;--accent:{{accent}}">

  <!-- artwork-derived header gradient -->
  <div style="position:absolute;left:0;right:0;top:0;height:420px;
    background:linear-gradient(to bottom,#6b3a63 0%,#3f2740 42%,#191720 76%,#0C0C0F 100%);"></div>

  <div style="position:absolute;inset:0;overflow:hidden;">
    <div style="height:48px"></div>

    <div style="display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m0 0 6.5-6.5M4 12l6.5 6.5"/></svg>
      <div style="flex-grow:1;"></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#F2F2F3"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </div>

    <div style="display:flex;justify-content:center;padding-top:6px;">
      <div class="art a1" style="width:176px;height:176px;box-shadow:0 18px 44px rgba(0,0,0,.55);"></div>
    </div>

    <div style="padding:20px 16px 0;">
      <div style="font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.12;">Low Ceiling</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <div style="width:22px;height:22px;border-radius:999px;flex:none;
          background:linear-gradient(140deg,#7b3f6b,#c05a58);"></div>
        <div style="font-size:13.5px;font-weight:600;">Vera Sound</div>
      </div>
      <div style="font-size:12.5px;color:#9A9AA2;margin-top:8px;">Album &middot; 2021 &middot; 11 songs, 44 min</div>
    </div>

    <div style="display:flex;align-items:center;gap:20px;padding:16px 16px 6px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#f24b6a"><path d="M12 20.5 4.2 13a4.9 4.9 0 0 1 7-6.9l.8.8.8-.8a4.9 4.9 0 0 1 7 6.9Z"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4 18.5h16"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h11M4 18h7M18 9v10m0 0 3-3m-3 3-3-3"/></svg>
      <div style="flex-grow:1;"></div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3.5 21 7l-4 3.5M21 7h-4.2c-2 0-3.2 1.2-4.4 3l-2.8 4c-1.2 1.8-2.4 3-4.4 3H3M3 7h2.2c1.5 0 2.6.7 3.6 1.9M17 13.5 21 17l-4 3.5M21 17h-4.2c-1.5 0-2.6-.7-3.6-1.9"/></svg>
      <div style="width:54px;height:54px;border-radius:999px;background:var(--accent);
        display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(242,75,106,.35);">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#12070A"><path d="M6.5 4.2v15.6L19.5 12Z"/></svg>
      </div>
    </div>

    <div class="trk">
      <div class="tno" style="color:#f24b6a;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#f24b6a" style="display:block;margin:0 auto;"><rect x="2" y="9" width="3.2" height="6" rx="1.2"/><rect x="7.4" y="5" width="3.2" height="14" rx="1.2"/><rect x="12.8" y="7.5" width="3.2" height="9" rx="1.2"/><rect x="18.2" y="10.5" width="3.2" height="3" rx="1.2"/></svg>
      </div>
      <div style="min-width:0;flex-grow:1;">
        <div class="ttl" style="color:#f24b6a;">Anchor Light</div>
        <div class="sub">Vera Sound</div>
      </div>
      <div class="dur">4:02</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>

    <div class="trk">
      <div class="tno">2</div>
      <div style="min-width:0;flex-grow:1;">
        <div class="ttl">Grain of the Room</div>
        <div class="sub">Vera Sound</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f24b6a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.7 2.8L16 9.5"/></svg>
      <div class="dur">3:18</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>

    <div class="trk">
      <div class="tno">3</div>
      <div style="min-width:0;flex-grow:1;">
        <div class="ttl">Second Storey</div>
        <div class="sub">Vera Sound, Nell Ashby</div>
      </div>
      <div class="dur">5:41</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>

    <div class="trk">
      <div class="tno">4</div>
      <div style="min-width:0;flex-grow:1;">
        <div class="ttl">Winter Tenants</div>
        <div class="sub">Vera Sound</div>
      </div>
      <div class="dur">3:55</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>

    <div class="trk">
      <div class="tno">5</div>
      <div style="min-width:0;flex-grow:1;">
        <div class="ttl">Hold the Line Open</div>
        <div class="sub">Vera Sound</div>
      </div>
      <div class="dur">4:27</div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;
    background:linear-gradient(to top,#0C0C0F 42%,rgba(12,12,15,.92) 62%,rgba(12,12,15,0));"></div>

  <div style="position:absolute;left:8px;right:8px;bottom:76px;height:60px;background:#24242B;border-radius:12px;
    display:flex;align-items:center;gap:10px;padding:0 10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);">
    <div class="art a1" style="width:42px;height:42px;border-radius:5px;"></div>
    <div style="flex-grow:1;min-width:0;">
      <div style="font-size:13.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Anchor Light</div>
      <div style="font-size:12px;color:#9A9AA2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Vera Sound</div>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#f24b6a"><path d="M12 20.5 4.2 13a4.9 4.9 0 0 1 7-6.9l.8.8.8-.8a4.9 4.9 0 0 1 7 6.9Z"/></svg>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#F2F2F3"><rect x="6.5" y="5" width="3.6" height="14" rx="1.1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.1"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M5 5.5v13l9.5-6.5Z"/><rect x="16.5" y="5.5" width="2.6" height="13" rx="1.1"/></svg>
    <div style="position:absolute;left:0;right:0;bottom:0;height:2px;background:#3A3A43;">
      <div style="width:37%;height:2px;background:var(--accent);"></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));padding:8px 24px 0;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f24b6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.4 12 3.6l8.5 6.8V20a1 1 0 0 1-1 1h-4.6v-6H9.1v6H4.5a1 1 0 0 1-1-1Z" fill="rgba(242,75,106,.16)"/></svg>
      <div style="font-size:10.5px;font-weight:600;color:var(--accent);">Home</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8.5 6.5v11M13 3.5v17M17.5 8v8M21 10.5v3"/></svg>
      <div style="font-size:10.5px;font-weight:500;color:#8E8E97;">Library</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4 18.5h16"/></svg>
      <div style="font-size:10.5px;font-weight:500;color:#8E8E97;">Downloads</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f24b6a","options":["#f24b6a","#1ed760","#7c5cff","#f5a623"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f24b6a' };
  }
}
</script>
</body>
</html>
