<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#0C0C0F;--surf:#1E1E23;--raised:#24242B;--tx:#F2F2F3;--dim:#9A9AA2;--faint:#6E6E77;--accent:#f24b6a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--tx);
      font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:#ff6b84;}
    .art{border-radius:8px;position:relative;overflow:hidden;flex:none;}
    .art::after{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.15),transparent 46%);}
    .a1{background-image:linear-gradient(142deg,#3b2f6e,#7b3f6b 55%,#c05a58);}
    .trk{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;}
    .tno{width:18px;text-align:center;font-size:13px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums;}
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#0C0C0F;">
  <div style="position:absolute;left:0;right:0;top:0;height:430px;
    background:linear-gradient(to bottom,#3d2a3c 0%,#26202a 45%,#141319 78%,#0C0C0F 100%);"></div>

  <div style="position:absolute;inset:0;overflow:hidden;">
    <div style="height:48px"></div>

    <!-- back and overflow only: the album name is already the headline below -->
    <div style="display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m0 0 6.5-6.5M4 12l6.5 6.5"/></svg>
      <div style="flex-grow:1;"></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#F2F2F3"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </div>

    <div style="display:flex;justify-content:center;padding-top:4px;">
      <div class="art a1" style="width:182px;height:182px;box-shadow:0 18px 44px rgba(0,0,0,.55);"></div>
    </div>

    <!-- left-aligned, so a long album name rags instead of centring awkwardly -->
    <div style="padding:22px 16px 0;">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.18;flex-grow:1;">The Black Parade</div>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:4px;"><path d="m5.5 9.5 6.5 6.5 6.5-6.5"/></svg>
      </div>
      <div style="font-size:13.5px;color:#C9C9D0;margin-top:8px;font-weight:600;">My Chemical Romance</div>
      <div style="font-size:12.5px;color:var(--dim);margin-top:4px;">Album &middot; 2006 &middot; 14 songs</div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding:18px 16px 0;">
      <div style="flex-grow:1;height:46px;border-radius:999px;background:var(--accent);color:#12070A;
        display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#12070A"><path d="M6.5 4.2v15.6L19.5 12Z"/></svg>Play
      </div>
      <div style="flex-grow:1;height:46px;border-radius:999px;border:1.4px solid #3A3A43;color:var(--tx);
        display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3.5 21 7l-4 3.5M21 7h-4.2c-2 0-3.2 1.2-4.4 3l-2.8 4c-1.2 1.8-2.4 3-4.4 3H3M3 7h2.2c1.5 0 2.6.7 3.6 1.9M17 13.5 21 17l-4 3.5M21 17h-4.2c-1.5 0-2.6-.7-3.6-1.9"/></svg>Shuffle
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;padding:22px 16px 4px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);">Disc 1</div>
      <div style="flex-grow:1;height:1px;background:#26262C;"></div>
    </div>

    <div class="trk">
      <div class="tno" style="color:var(--accent);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#f24b6a" style="display:block;margin:0 auto;"><rect x="2" y="9" width="3.2" height="6" rx="1.2"/><rect x="7.4" y="5" width="3.2" height="14" rx="1.2"/><rect x="12.8" y="7.5" width="3.2" height="9" rx="1.2"/><rect x="18.2" y="10.5" width="3.2" height="3" rx="1.2"/></svg>
      </div>
      <div style="min-width:0;flex-grow:1;">
        <div style="font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--accent);">The End.</div>
        <div style="font-size:12.5px;color:var(--dim);">My Chemical Romance &middot; 1:52</div>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>

    <div class="trk">
      <div class="tno">2</div>
      <div style="min-width:0;flex-grow:1;">
        <div style="font-size:15px;font-weight:500;letter-spacing:-.01em;">Dead!</div>
        <div style="font-size:12.5px;color:var(--dim);">My Chemical Romance &middot; 3:15</div>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>

    <div class="trk">
      <div class="tno">3</div>
      <div style="min-width:0;flex-grow:1;">
        <div style="font-size:15px;font-weight:500;letter-spacing:-.01em;">This Is How I Disappear</div>
        <div style="font-size:12.5px;color:var(--dim);">My Chemical Romance &middot; 3:59</div>
      </div>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="#6E6E77"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;
    background:linear-gradient(to top,#0C0C0F 55%,rgba(12,12,15,0));"></div>

  <div style="position:absolute;left:8px;right:8px;bottom:76px;height:60px;background:var(--raised);border-radius:12px;
    display:flex;align-items:center;gap:10px;padding:0 10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);">
    <div class="art a1" style="width:42px;height:42px;border-radius:5px;"></div>
    <div style="flex-grow:1;min-width:0;">
      <div style="font-size:14px;font-weight:600;letter-spacing:-.01em;">The End.</div>
      <div style="font-size:12px;color:var(--dim);">My Chemical Romance</div>
    </div>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M6.5 5v14l11-7Z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M5 5.5v13l9.5-6.5Z"/><rect x="16.5" y="5.5" width="2.6" height="13" rx="1.1"/></svg>
    <div style="position:absolute;left:0;right:0;bottom:0;height:3px;background:#3A3A43;">
      <div style="width:31%;height:3px;background:var(--accent);"></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));padding:10px 24px 0;
    background:linear-gradient(to top,#0C0C0F 55%,rgba(12,12,15,.9));">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.4 12 3.6l8.5 6.8V20a1 1 0 0 1-1 1h-4.6v-6H9.1v6H4.5a1 1 0 0 1-1-1Z"/></svg>
      <div style="font-size:10.5px;font-weight:500;color:#8E8E97;">Home</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f24b6a" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8.5 6.5v11M13 3.5v17M17.5 8v8M21 10.5v3"/></svg>
      <div style="font-size:10.5px;font-weight:600;color:var(--accent);">Library</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4 18.5h16"/></svg>
      <div style="font-size:10.5px;font-weight:500;color:#8E8E97;">Download</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
