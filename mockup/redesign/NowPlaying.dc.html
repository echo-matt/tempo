<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#0C0C0F;--surf:#1E1E23;--tx:#F2F2F3;--dim:#9A9AA2;--accent:#f24b6a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--tx);
      font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:#ff6b84;}
    .art{border-radius:10px;position:relative;overflow:hidden;flex:none;}
    .art::after{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.15),transparent 46%);}
    .a1{background-image:linear-gradient(142deg,#3b2f6e,#7b3f6b 55%,#c05a58);}
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#0C0C0F;">

  <!-- ambient wash keyed to the cover; neutral until Palette samples it -->
  <div style="position:absolute;inset:0;
    background:linear-gradient(to bottom,#4a2b46 0%,#2c1e2d 30%,#15131A 62%,#0C0C0F 100%);"></div>

  <div style="position:absolute;inset:0;">
    <div style="height:48px"></div>

    <!-- the real top row: codec, bitrate, track info. Quieter than it is today. -->
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;height:44px;">
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
        padding:4px 9px;border-radius:5px;background:rgba(255,255,255,.10);color:#D6D6DA;">flac</div>
      <div style="font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;">1029 kbps</div>
      <div style="flex-grow:1;"></div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.1" fill="#9A9AA2" stroke="none"/></svg>
    </div>

    <div style="display:flex;justify-content:center;padding-top:14px;">
      <div class="art a1" style="width:326px;height:326px;box-shadow:0 26px 60px rgba(0,0,0,.6);"></div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:16px;padding:34px 32px 0;">
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Anchor Light</div>
        <div style="font-size:14.5px;color:#B9B9C0;margin-top:6px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Vera Sound</div>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:4px;"><path d="M12 20.5 4.2 13a4.9 4.9 0 0 1 7-6.9l.8.8.8-.8a4.9 4.9 0 0 1 7 6.9Z"/></svg>
    </div>

    <div style="padding:26px 32px 0;">
      <div style="height:4px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;">
        <div style="width:31%;height:4px;border-radius:999px;background:var(--accent);"></div>
        <div style="position:absolute;left:31%;top:50%;width:13px;height:13px;border-radius:999px;
          background:var(--accent);transform:translate(-50%,-50%);"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:9px;">
        <div style="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;">1:29</div>
        <div style="font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;">4:55</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:24px 32px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3.5 21 7l-4 3.5M21 7h-4.2c-2 0-3.2 1.2-4.4 3l-2.8 4c-1.2 1.8-2.4 3-4.4 3H3M3 7h2.2c1.5 0 2.6.7 3.6 1.9M17 13.5 21 17l-4 3.5M21 17h-4.2c-1.5 0-2.6-.7-3.6-1.9"/></svg>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M19 5.5v13L9.5 12Z"/><rect x="4.9" y="5.5" width="2.7" height="13" rx="1.1"/></svg>
      <div style="width:72px;height:72px;border-radius:999px;background:var(--accent);
        display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(242,75,106,.4);">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#12070A"><path d="M6.5 4.2v15.6L19.5 12Z"/></svg>
      </div>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M5 5.5v13L14.5 12Z"/><rect x="16.4" y="5.5" width="2.7" height="13" rx="1.1"/></svg>
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V8a3 3 0 0 1 3-3h10.5m0 0L14 1.8m3.5 3.2L14 8.2M20 15v1a3 3 0 0 1-3 3H6.5m0 0L10 22.2M6.5 19 10 15.8"/></svg>
    </div>

    <!-- the one quick action the screen actually has -->
    <div style="display:flex;justify-content:center;padding-top:30px;">
      <div style="display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;border-radius:999px;
        background:rgba(255,255,255,.08);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round"><path d="M4 6h11M4 11h11M4 16h7"/><circle cx="18" cy="16" r="2.6"/><path d="M20.6 16V8.5l2.2.8"/></svg>
        <div style="font-size:12.5px;font-weight:600;">Queue</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
