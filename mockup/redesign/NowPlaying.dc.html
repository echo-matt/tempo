<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#0C0C0F;--tx:#F2F2F3;--tx-dim:#9A9AA2;--accent:#f24b6a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--tx);
      font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:#ff6b84;}
    .art{border-radius:10px;position:relative;overflow:hidden;flex:none;}
    .art::after{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.15),transparent 46%);}
    .a1{background-image:linear-gradient(142deg,#3b2f6e,#7b3f6b 55%,#c05a58);}
    .eyebrow{font-size:10px;font-weight:600;letter-spacing:.14em;color:#9A9AA2;text-transform:uppercase;}
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#0C0C0F;--accent:{{accent}}">

  <!-- ambient wash sampled from the artwork -->
  <div style="position:absolute;inset:0;
    background:linear-gradient(to bottom,#5f3558 0%,#392438 34%,#17141C 66%,#0C0C0F 100%);"></div>

  <div style="position:absolute;inset:0;">
    <div style="height:48px"></div>

    <div style="display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5.5 9.5 6.5 6.5 6.5-6.5"/></svg>
      <div style="flex-grow:1;text-align:center;min-width:0;">
        <div class="eyebrow">Playing from album</div>
        <div style="font-size:12.5px;font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Low Ceiling</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#F2F2F3"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </div>

    <div style="display:flex;justify-content:center;padding-top:26px;">
      <div class="art a1" style="width:326px;height:326px;box-shadow:0 26px 60px rgba(0,0,0,.6);"></div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:16px;padding:32px 32px 0;">
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Anchor Light</div>
        <div style="font-size:14.5px;color:#B9B9C0;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Vera Sound</div>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#f24b6a" style="flex:none;margin-top:4px;"><path d="M12 20.5 4.2 13a4.9 4.9 0 0 1 7-6.9l.8.8.8-.8a4.9 4.9 0 0 1 7 6.9Z"/></svg>
    </div>

    <div style="padding:26px 32px 0;">
      <div style="height:4px;border-radius:999px;background:rgba(255,255,255,.22);position:relative;">
        <div style="width:37%;height:4px;border-radius:999px;background:var(--accent);"></div>
        <div style="position:absolute;left:37%;top:50%;width:13px;height:13px;border-radius:999px;
          background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(242,75,106,.18);"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:9px;">
        <div style="font-size:11px;color:#9A9AA2;font-variant-numeric:tabular-nums;">1:29</div>
        <div style="font-size:11px;color:#9A9AA2;font-variant-numeric:tabular-nums;">4:02</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 32px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f24b6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3.5 21 7l-4 3.5M21 7h-4.2c-2 0-3.2 1.2-4.4 3l-2.8 4c-1.2 1.8-2.4 3-4.4 3H3M3 7h2.2c1.5 0 2.6.7 3.6 1.9M17 13.5 21 17l-4 3.5M21 17h-4.2c-1.5 0-2.6-.7-3.6-1.9"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M19 5.5v13L9.5 12Z"/><rect x="4.9" y="5.5" width="2.7" height="13" rx="1.1"/></svg>
      <div style="width:66px;height:66px;border-radius:999px;background:var(--accent);
        display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(242,75,106,.4);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#12070A"><rect x="6.5" y="4.5" width="4" height="15" rx="1.3"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.3"/></svg>
      </div>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M5 5.5v13L14.5 12Z"/><rect x="16.4" y="5.5" width="2.7" height="13" rx="1.1"/></svg>
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V8a3 3 0 0 1 3-3h10.5m0 0L14 1.8m3.5 3.2L14 8.2M20 15v1a3 3 0 0 1-3 3H6.5m0 0L10 22.2M6.5 19 10 15.8"/></svg>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:34px 32px 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M2.5 19.5h4a4 4 0 0 0-4-4Z" fill="#9A9AA2" stroke="none"/></svg>
      <div style="display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.09);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F2F2F3" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 11h11M4 16h13M4 21h8"/></svg>
        <div style="font-size:12px;font-weight:600;">Lyrics</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 11h11M4 16h7M17.5 9v11m0 0 3.2-3.2M17.5 20l-3.2-3.2"/></svg>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f24b6a","options":["#f24b6a","#1ed760","#7c5cff","#f5a623"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f24b6a' };
  }
}
</script>
</body>
</html>
