<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <style>
    :root{--bg:#0C0C0F;--tx:#F2F2F3;--tx-dim:#9A9AA2;--accent:#f24b6a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--tx);
      font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:none;} a:hover{color:#ff6b84;}
    .art{border-radius:6px;position:relative;overflow:hidden;flex:none;}
    .art::after{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.15),transparent 46%);}
    .a2{background-image:linear-gradient(152deg,#0f4c46,#1f7a5c 58%,#8fbf6a);}
    .a3{background-image:linear-gradient(158deg,#5a2230,#a33f45 52%,#e08a5a);}
    .a5{background-image:linear-gradient(145deg,#2a2438,#5c4a7d 55%,#a487c9);}
    .a1{background-image:linear-gradient(142deg,#3b2f6e,#7b3f6b 55%,#c05a58);}
    .ttl{font-size:15px;font-weight:500;letter-spacing:-.01em;line-height:1.3;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .sub{font-size:13px;color:var(--tx-dim);line-height:1.3;}
    .tile{height:84px;border-radius:8px;position:relative;overflow:hidden;padding:11px 12px;}
    .tile > .name{font-size:15px;font-weight:700;letter-spacing:-.015em;color:#fff;
      position:relative;z-index:1;max-width:80px;line-height:1.15;}
    .tile > .chip{position:absolute;right:-12px;bottom:-10px;width:56px;height:56px;border-radius:5px;
      transform:rotate(26deg);box-shadow:0 6px 14px rgba(0,0,0,.35);}
  </style>
</helmet>

<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#0C0C0F;--accent:{{accent}}">
  <div style="position:absolute;inset:0;overflow:hidden;">

    <div style="height:48px"></div>

    <div style="display:flex;align-items:center;padding:0 16px;height:52px;">
      <div style="font-size:22px;font-weight:700;letter-spacing:-.025em;">Search</div>
    </div>

    <div style="padding:6px 16px 0;">
      <div style="display:flex;align-items:center;gap:10px;height:48px;border-radius:8px;background:#24242B;padding:0 14px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        <div style="font-size:14px;color:#8B8B94;">Songs, albums, artists, podcasts</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;padding:24px 16px 8px;">
      <div style="font-size:16.5px;font-weight:700;letter-spacing:-.02em;flex-grow:1;">Recent searches</div>
      <div style="font-size:12px;font-weight:600;color:#9A9AA2;">Clear</div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;">
      <div class="art a1" style="width:44px;height:44px;"></div>
      <div style="flex-grow:1;min-width:0;">
        <div class="ttl">Low Ceiling</div>
        <div class="sub">Album &middot; Vera Sound</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E77" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </div>

    <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;">
      <div style="width:44px;height:44px;flex:none;border-radius:999px;background:linear-gradient(140deg,#1b2f4d,#7fc4c9);"></div>
      <div style="flex-grow:1;min-width:0;">
        <div class="ttl">Nell Ashby</div>
        <div class="sub">Artist</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E77" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </div>

    <div style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;">
      <div class="art a2" style="width:44px;height:44px;"></div>
      <div style="flex-grow:1;min-width:0;">
        <div class="ttl">Kite Season</div>
        <div class="sub">Song &middot; Kite Season</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E77" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </div>

    <div style="padding:22px 16px 10px;font-size:16.5px;font-weight:700;letter-spacing:-.02em;">Browse your library</div>

    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;padding:0 16px;">
      <div class="tile" style="background:#8a3a4e;">
        <div class="name">Genres</div>
        <div class="chip" style="background:linear-gradient(140deg,#3b2f6e,#c05a58);"></div>
      </div>
      <div class="tile" style="background:#1f5b52;">
        <div class="name">Decades</div>
        <div class="chip" style="background:linear-gradient(140deg,#0f4c46,#8fbf6a);"></div>
      </div>
      <div class="tile" style="background:#3f3670;">
        <div class="name">Podcasts</div>
        <div class="chip" style="background:linear-gradient(140deg,#2a2438,#a487c9);"></div>
      </div>
      <div class="tile" style="background:#7a5a1c;">
        <div class="name">Radio</div>
        <div class="chip" style="background:linear-gradient(140deg,#4a3312,#d9a441);"></div>
      </div>
      <div class="tile" style="background:#26506e;">
        <div class="name">Folders</div>
        <div class="chip" style="background:linear-gradient(140deg,#1b2f4d,#7fc4c9);"></div>
      </div>
      <div class="tile" style="background:#5c2f47;">
        <div class="name">Starred</div>
        <div class="chip" style="background:linear-gradient(140deg,#f24b6a,#7b2b52);"></div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;
    background:linear-gradient(to top,#0C0C0F 42%,rgba(12,12,15,.92) 62%,rgba(12,12,15,0));"></div>

  <div style="position:absolute;left:8px;right:8px;bottom:76px;height:60px;background:#24242B;border-radius:12px;
    display:flex;align-items:center;gap:10px;padding:0 10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45);">
    <div class="art a1" style="width:42px;height:42px;border-radius:5px;"></div>
    <div style="flex-grow:1;min-width:0;">
      <div style="font-size:13.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Anchor Light</div>
      <div style="font-size:12px;color:#9A9AA2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Vera Sound</div>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#f24b6a"><path d="M12 20.5 4.2 13a4.9 4.9 0 0 1 7-6.9l.8.8.8-.8a4.9 4.9 0 0 1 7 6.9Z"/></svg>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#F2F2F3"><rect x="6.5" y="5" width="3.6" height="14" rx="1.1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.1"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#F2F2F3"><path d="M5 5.5v13l9.5-6.5Z"/><rect x="16.5" y="5.5" width="2.6" height="13" rx="1.1"/></svg>
    <div style="position:absolute;left:0;right:0;bottom:0;height:2px;background:#3A3A43;">
      <div style="width:37%;height:2px;background:var(--accent);"></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));padding:8px 24px 0;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f24b6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.4 12 3.6l8.5 6.8V20a1 1 0 0 1-1 1h-4.6v-6H9.1v6H4.5a1 1 0 0 1-1-1Z" fill="rgba(242,75,106,.16)"/></svg>
      <div style="font-size:10.5px;font-weight:600;color:var(--accent);">Home</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8.5 6.5v11M13 3.5v17M17.5 8v8M21 10.5v3"/></svg>
      <div style="font-size:10.5px;font-weight:500;color:#8E8E97;">Library</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8E8E97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4 18.5h16"/></svg>
      <div style="font-size:10.5px;font-weight:500;color:#8E8E97;">Downloads</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f24b6a","options":["#f24b6a","#1ed760","#7c5cff","#f5a623"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f24b6a' };
  }
}
</script>
</body>
</html>
